<!DOCTYPE html>
<html>
<head>
  <title>Read Aloud Extension Test</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://unpkg.com/qunit@2.19.1/qunit/qunit.css">
</head>
<body>
  <div id="qunit"></div>
  <div id="qunit-fixture"></div>

  <div id="popup-elements" style="display: none;">
    <button id="play-pause">Play</button>
    <button id="stop">Stop</button>
    <input type="range" id="rate" min="0.5" max="2" value="1" step="0.1">
    <span id="rate-value">1.0x</span>
    <select id="voices"></select>
  </div>

  <script src="https://unpkg.com/qunit@2.19.1/qunit/qunit.js"></script>
  <script>
    window.qunit_fails = [];
    window.qunit_errors = [];
    QUnit.log(function(details) {
      if (details.result) { return; }
      window.qunit_fails.push(details);
    });
    QUnit.testDone(function(details) {
      if (details.failed > 0) {
        window.qunit_fails.push({ type: 'testDone', details });
      }
    });
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      window.qunit_errors.push({msg, url, lineNo});
    };
  </script>
  <script src="mocks.js"></script>
  <script>
    // Mock importScripts for background.js since we're in a browser environment
    window.importScripts = function() {};
  </script>
  <script src="../scripts/content.js"></script>
  <script src="../scripts/utils.js"></script>
  <script src="../scripts/background.js"></script>
  <script src="../scripts/popup.js"></script>
  <script src="test.js"></script>
</body>
</html>
